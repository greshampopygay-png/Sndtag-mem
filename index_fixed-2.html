<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Tag</title>

<style>
body{
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    margin:0;
    font-family:Arial;
}

img{
    width:250px;
    border-radius:20px;
    cursor:pointer;
    transition:0.2s;
}

img:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<h1>Нажми 😈</h1>

<img id="btn" src="https://i.imgur.com/8Km9tLL.png">

<audio id="audio" loop preload="auto">
    <source src="./sound.mp3" type="audio/mpeg">
    Твой браузер не поддерживает аудио.
</audio>

<p id="status" style="font-size:14px;color:#aaa;"></p>

<script>
const btn = document.getElementById("btn");
const audio = document.getElementById("audio");
const status = document.getElementById("status");

let playing = false;

// Проверяем, загрузился ли sound.mp3
audio.addEventListener("canplaythrough", () => {
    status.textContent = "🔊 Аудио загружено";
});

audio.addEventListener("error", () => {
    status.textContent = "❌ Не удалось загрузить sound.mp3. Проверь имя и папку файла.";
    console.error("Ошибка загрузки sound.mp3:", audio.error);
});

btn.addEventListener("click", async () => {
    try {
        if (!playing) {
            await audio.play();
            playing = true;
            status.textContent = "🔊 Звук играет";
            btn.style.transform = "scale(1.05)";
        } else {
            audio.pause();
            audio.currentTime = 0;
            playing = false;
            status.textContent = "⏸ Звук остановлен";
            btn.style.transform = "scale(1)";
        }
    } catch (error) {
        status.textContent = "❌ Браузер не смог запустить звук";
        console.error("Ошибка audio.play():", error);
    }
});
</script>

</body>
</html>
